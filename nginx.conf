server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Payload pousse dans le volume. Jamais cache : un data.json perime
    # montrerait des gateways en bonne sante qui sont tombees depuis.
    location = /data.json {
        alias /data/data.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # Rien de pousse encore (premier deploiement, ou push casse) : 204
        # plutot que 404, pour que la page dise « en attente » au lieu
        # d'afficher une erreur.
        try_files $uri =204;
    }

    # index.html est la CLE DE VOUTE : il porte la version de chaque asset.
    # Garde en cache, il continue de pointer vers les anciennes adresses et
    # plus aucun deploiement ne peut se voir.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }

    # Les assets portent un hash de contenu dans leur URL : une nouvelle
    # version est une nouvelle adresse, qu'aucun cache ne peut servir avec un
    # ancien corps. Ils peuvent donc etre gardes un an.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
